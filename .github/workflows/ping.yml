name: Ping Backend

on:
  push:
    branches: [main, dev]
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/api/health || true
        env:
          BACKEND_URL: https://task-manager-backend.onrender.com