name: Ping Services

on:
  push:
    branches: [main, dev]
  schedule:
    - cron: '*/4 * * * *'  # Every 4 minutes to prevent auto-suspend
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel frontend
        run: curl -s -o /dev/null -w "%{http_code}" https://task-manager-pro-psi.vercel.app || true

      - name: Ping Render backend
        run: curl -s -o /dev/null -w "%{http_code}" https://task-manager-backend.onrender.com/api/health || true

      - name: Ping Neon database (wake up)
        run: curl -s -o /dev/null -w "%{http_code}" "https://ep-wispy-cell-amcju1ka.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require" || true